<div class="settings-page">
  <h1>{{ t.title }}</h1>

  @if (!loading()) {
    <form class="settings-form" (ngSubmit)="save()">
      <label>
        {{ t.gymName }}
        <input type="text" name="gymName" [(ngModel)]="gymName" />
      </label>

      <label>
        {{ t.antiPassbackMinutes }}
        <input type="number" name="antiPassbackMinutes" [(ngModel)]="antiPassbackMinutes" />
      </label>

      <label class="checkbox">
        <input type="checkbox" name="requireApprovedCertificate" [(ngModel)]="requireApprovedCertificate" />
        {{ t.requireApprovedCertificate }}
      </label>

      <label>
        {{ t.certificateGraceDays }}
        <input type="number" name="certificateGraceDays" [(ngModel)]="certificateGraceDays" />
      </label>

      <label>
        {{ t.registrationFeeEuro }}
        <input type="number" step="0.01" name="registrationFeeEuro" [(ngModel)]="registrationFeeEuro" />
      </label>

      <label>
        {{ t.whatsappSupport }}
        <input type="text" name="whatsappSupport" [(ngModel)]="whatsappSupport" />
      </label>

      @if (errorMessage()) {
        <p class="status error">{{ errorMessage() }}</p>
      }
      @if (infoMessage()) {
        <p class="status success">{{ infoMessage() }}</p>
      }

      <button type="submit" [disabled]="saving()">{{ t.save }}</button>
    </form>
  }
</div>
