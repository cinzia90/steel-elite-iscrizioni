<div class="staff-page">
  <h1>{{ t.title }}</h1>

  <form class="invite-form" (ngSubmit)="invite()">
    <h2>{{ t.inviteTitle }}</h2>

    <label>
      {{ t.email }}
      <input type="email" name="email" [(ngModel)]="email" required />
    </label>
    <label>
      {{ t.firstName }}
      <input type="text" name="firstName" [(ngModel)]="firstName" />
    </label>
    <label>
      {{ t.lastName }}
      <input type="text" name="lastName" [(ngModel)]="lastName" />
    </label>

    @if (errorMessage()) {
      <p class="status error">{{ errorMessage() }}</p>
    }
    @if (infoMessage()) {
      <p class="status success">{{ infoMessage() }}</p>
    }

    <button type="submit" [disabled]="inviting()">
      {{ inviting() ? t.inviting : t.invite }}
    </button>
  </form>

  <div class="staff-list">
    @for (member of staff(); track member.id) {
      <div class="staff-row">
        <div class="info">
          <span class="name">{{ member.firstName }} {{ member.lastName }}</span>
          <span class="email">{{ member.email }}</span>
        </div>
        <span [class.active-badge]="!member.disabled" [class.disabled-badge]="member.disabled">
          {{ member.disabled ? t.disabled : t.active }}
        </span>
        <button (click)="toggle(member)">{{ member.disabled ? t.enable : t.disable }}</button>
      </div>
    }
  </div>
</div>
