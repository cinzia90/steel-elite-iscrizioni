<div class="pending-page">
  <div class="card">
    <h1>{{ t.title }}</h1>

    @switch (status()) {
      @case ('cancelled') {
        <p>{{ t.cancelled }}</p>
        <button (click)="retry()">{{ t.retry }}</button>
      }
      @case ('active') {
        <p class="success">{{ t.success }}</p>
      }
      @default {
        <p>{{ t.pending }}</p>
      }
    }
  </div>
</div>
