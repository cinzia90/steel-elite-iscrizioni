<div class="profile-page">
  <form class="card" (ngSubmit)="submit()">
    <h1>{{ t.title }}</h1>

    <label class="photo-label">
      {{ t.photo }}
      @if (photoPreviewUrl()) {
        <img class="photo-preview" [src]="photoPreviewUrl()" alt="" />
      }
      <input type="file" accept="image/*" (change)="onPhotoSelected($event)" />
    </label>

    <label>
      {{ t.firstName }}
      <input type="text" name="firstName" [(ngModel)]="firstName" required />
    </label>

    <label>
      {{ t.lastName }}
      <input type="text" name="lastName" [(ngModel)]="lastName" required />
    </label>

    <label>
      {{ t.fiscalCode }}
      <input type="text" name="fiscalCode" [(ngModel)]="fiscalCode" required />
    </label>

    <label>
      {{ t.birthDate }}
      <input type="date" name="birthDate" [(ngModel)]="birthDate" required />
    </label>

    <label>
      {{ t.phone }}
      <input type="tel" name="phone" [(ngModel)]="phone" required />
    </label>

    <label>
      {{ t.address }}
      <input type="text" name="address" [(ngModel)]="address" required />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? t.submitting : (alreadySubscribed() ? t.submitReturning : t.submit) }}
    </button>
  </form>
</div>
