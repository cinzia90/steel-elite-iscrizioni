<div class="admin-layout">
  <nav class="admin-nav">
    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ t.dashboard }}</a>
    <a routerLink="/admin/clienti" routerLinkActive="active">{{ t.clients }}</a>
    <a routerLink="/admin/certificati" routerLinkActive="active">{{ t.certificates }}</a>
    <a routerLink="/admin/piani" routerLinkActive="active">{{ t.plans }}</a>
    <a routerLink="/admin/ingressi" routerLinkActive="active">{{ t.accessLogs }}</a>
    <a routerLink="/admin/staff" routerLinkActive="active">{{ t.staff }}</a>
    <a routerLink="/admin/contratti" routerLinkActive="active">{{ t.contracts }}</a>
    <a routerLink="/admin/qr-locandina" routerLinkActive="active">{{ t.qrPoster }}</a>
    <a routerLink="/admin/impostazioni" routerLinkActive="active">{{ t.settings }}</a>
  </nav>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
